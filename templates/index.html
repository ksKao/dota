<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miss Hook Calculator</title>
  </head>
  <body>
    <form id="replay-form">
      <input type="file" id="file-input" />
      <button type="submit">Submit</button>
    </form>
    <pre id="output"></pre>
  </body>

  <script>
    /** @type {HTMLFormElement} */
    const form = document.getElementById("replay-form");
    /** @type {HTMLInputElement} */
    const fileInput = document.getElementById("file-input");
    /** @type {HTMLPreElement} */
    const output = document.getElementById("output");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      const response = await fetch("/", {
        method: "POST",
        body: formData,
      });

      if (!response.ok) {
        const text = await response.text();
        output.innerText = text || "An error occurred";
      }

      /**
       * @typedef {Object} Hook
       * @property {number} timestamp
       * @property {boolean} isMissed
       * @property {boolean} [isEnemy]
       * @property {boolean} [isCreep]
       * @property {string} [target]
       */

      /**
       * @typedef {Object} HookResponse
       * @property {Hook[]} hooks
       * @property {number} start
       */

      /** @type {HookResponse} */
      const data = await response.json();
      output.innerText = JSON.stringify(data);
    });
  </script>
</html>
